<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELO CITY | Магазин велосипедов</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">VELO CITY</div>
        <nav>
            <a href="#catalog">Каталог</a>
            <a href="#about">О нас</a>
            <a href="#contacts">Контакты</a>
        </nav>
    </header>

    <section class="hero">
        <h1>VELO CITY</h1>
        <p>Велосипеды для города и приключений</p>
        <a href="#catalog" class="btn">Выбрать велосипед</a>
    </section>

    <section id="catalog" class="catalog">
        <h2>Наш каталог</h2>
        <div class="bike-grid">
            <div class="bike-card">
                <img src="images/bike1.jpg" alt="Городской велосипед">
                <h3>City Rider</h3>
                <p>Лёгкий и манёвренный для города</p>
                <span class="price">₽25 000</span>
                <button class="order-btn">Заказать</button>
            </div>
            <!-- Добавьте ещё 3-4 карточки -->
        </div>
    </section>

    <footer>
        <p>&copy; 2025 VELO CITY. Все права защищены.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
